<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リズム — MusCos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/rhythm.js"></script>
</head>
<body>
<div class="wrap">
  <header class="site-head">
    <a class="brand" href="index.html">MusCos</a>
    <nav>
      <a href="quiz.html">音あて</a>
      <a href="rhythm.html" aria-current="page">リズム</a>
    </nav>
  </header>

  <div class="rhythm-top">
    <div>
      <h1 class="page-title">リズム</h1>
      <p class="page-lead">1小節のカウントのあと、光っている拍のリズムを叩いてください。休符で叩いても減点しません。</p>
    </div>
    <div class="bpm-box"><output id="bpmOut">96</output><span>BPM</span></div>
  </div>

  <section class="panel" style="margin-top:20px">
    <div class="rhythm-controls">
      <div class="field">
        <label for="bpm">テンポ</label>
        <input type="range" id="bpm" min="60" max="180" step="1" value="96">
        <input type="number" id="bpmNum" min="60" max="180" value="96" aria-label="BPMを数字で入力">
      </div>
      <div class="field">
        <label for="level">難しさ</label>
        <select id="level"></select>
      </div>
      <label class="field"><input type="checkbox" id="model"> お手本の音を鳴らす</label>
    </div>
    <div class="btn-row" style="margin-top:16px">
      <button type="button" class="btn primary" id="startBtn">開始</button>
      <button type="button" class="btn" id="stopBtn" disabled>やめる</button>
      <button type="button" class="btn" id="newBtn">別のリズムにする</button>
    </div>

    <div class="grid-wrap">
      <div class="rgrid" id="grid"></div>
      <div class="cursor" id="cursor"></div>
      <div class="countin" id="countin" aria-live="assertive"></div>
    </div>

    <div class="judge" id="judge" aria-live="polite"></div>
    <button type="button" class="tap-pad" id="pad">ここを叩く<small>PCはスペースキーでも叩けます</small></button>
  </section>

  <section class="results" id="results" hidden>
    <div class="panel">
      <h2>結果</h2>
      <p class="big" id="accuracy"></p>
      <table>
        <tr><th>ぴったり（Perfect）</th><td id="rPerfect"></td></tr>
        <tr><th>おしい（Good）</th><td id="rGood"></td></tr>
        <tr><th>ミス</th><td id="rMiss"></td></tr>
        <tr><th>ズレの平均</th><td id="rMean"></td></tr>
      </table>
      <p id="tendency" style="margin-top:8px"></p>
      <p class="sub" id="best"></p>
    </div>
  </section>

  <div style="margin-top:20px">
    <div class="meter" id="meter" aria-hidden="true"></div>
    <div class="meter-scale"><span>早い −100ms</span><span>ぴったり</span><span>遅い +100ms</span></div>
  </div>

  <section class="calib">
    <div class="panel">
      <h2>ズレの補正</h2>
      <p>イヤホンや端末によって、音が遅れて聞こえることがあります。「補正をはじめる」を押すと、カチカチという音が12回鳴ります。5回目からの音に合わせて叩くと、ズレを測って以後の判定に反映します。</p>
      <div class="btn-row" style="margin-top:12px">
        <button type="button" class="btn primary" id="calibBtn">補正をはじめる</button>
        <button type="button" class="btn" id="calibReset">補正を0に戻す</button>
        <span id="calibValue" style="font-weight:700"></span>
      </div>
    </div>
  </section>

  <footer class="site-foot">音が出ます。スマホはマナーモードを解除してください。</footer>
</div>
</body>
</html>
